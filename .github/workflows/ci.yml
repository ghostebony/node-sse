name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:

env:
  NODE_VERSION: 26
  PNPM_VERSION: 12

jobs:
  check:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - &checkout
        name: Checkout Repository
        uses: actions/checkout@v7

      - &setup_pnpm
        name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - &setup_node
        name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - &install
        name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code
        run: pnpm check

  lint:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - *checkout

      - *setup_pnpm

      - *setup_node

      - *install

      - name: Lint code
        run: pnpm lint
